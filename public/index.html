<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>加油记录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:880px;margin:42px auto;padding:0 18px}.head{margin-bottom:22px}.tag{color:#246bfe;font-size:12px;font-weight:700;letter-spacing:.12em}.head h1{margin:7px 0;font-size:29px}.muted{color:#718096;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.card{background:white;border:1px solid #e7ebf2;border-radius:16px;padding:21px;box-shadow:0 10px 30px #1c2b470b;margin-bottom:18px}.stats .card{margin:0}.label{color:#718096;font-size:13px}.value{font-size:29px;font-weight:750;margin-top:9px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;font-size:13px;margin-bottom:7px;color:#536174}.field input{height:43px;width:100%;border:1px solid #dce2eb;border-radius:9px;padding:0 11px;font:inherit}button{height:43px;padding:0 16px;border:0;border-radius:9px;cursor:pointer;font-weight:600}.primary{background:#246bfe;color:white}.tools{display:flex;gap:8px}.soft{background:#edf3ff;color:#246bfe}.plain{background:transparent;color:#718096;height:32px;padding:0 9px}.danger{color:#d64545}h2{font-size:17px;margin:0}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:400px}th{text-align:left;color:#718096;font-size:12px;padding:0 10px 12px;border-bottom:1px solid #e7ebf2}td{padding:14px 10px;border-bottom:1px solid #f0f2f6;font-size:14px}.right{text-align:right}.amount{font-weight:650}.empty{text-align:center;color:#718096;padding:30px}.foot{text-align:center;color:#718096;font-size:12px;margin:20px 0}.status{font-size:12px;color:#17804b}@media(max-width:600px){.wrap{margin:25px auto}.form{grid-template-columns:1fr}.form button{width:100%}.stats .card{padding:16px}.value{font-size:23px}.card{padding:17px}.bar{align-items:flex-start;gap:10px;flex-direction:column}.tools{width:100%}.tools button{flex:1}}
</style></head>
<body><main class="wrap">
<header class="head"><div class="tag">FUEL LOG</div><h1>加油记录</h1><p class="muted">记录每次加油日期与金额，自动汇总累计支出。</p></header>
<section class="stats"><div class="card"><div class="label">累计加油金额</div><div class="value" id="total">0.00</div><div class="muted">所有记录金额合计</div></div><div class="card"><div class="label">加油次数</div><div class="value" id="count">0</div><div class="muted">已保存的记录数</div></div></section>
<section class="card"><h2 id="formTitle" style="margin-bottom:16px">添加一笔记录</h2><form class="form" id="form"><div class="field"><label for="date">加油日期</label><input id="date" type="date" required></div><div class="field"><label for="amount">加油金额</label><input id="amount" type="number" min=".01" step=".01" placeholder="请输入金额" required></div><button class="primary" id="submit" type="submit">保存记录</button></form></section>
<section class="card"><div class="bar"><h2>历史记录</h2><div class="tools"><button class="soft" id="export">导出 CSV</button><button class="plain" id="clear">清空记录</button></div></div><div class="tablebox"><table><thead><tr><th>加油日期</th><th class="right">金额</th><th class="right">操作</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">还没有记录，添加第一笔加油记录吧。</div></div></section>
<p class="foot"><span class="status" id="status">正在连接本地数据文件…</span><br>数据保存在本文件夹的 data.js 中。请定期备份整个文件夹。</p>
</main>
<script>
(() => {
 const $=id=>document.getElementById(id); let records=[], editing=null;
 const money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
 async function load(){try{const r=await fetch('/api/records');if(!r.ok)throw Error();const d=await r.json();records=d.records||[];$('status').textContent='已连接 data.js，本地保存正常';render();}catch(e){$('status').textContent='无法连接数据文件，请按说明启动本地服务';}}
 async function save(){const r=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({records})});if(!r.ok)throw Error('save failed');$('status').textContent='已写入 data.js，保存成功';}
 function render(){ $('total').textContent=money(records.reduce((s,r)=>s+Number(r.amount),0));$('count').textContent=records.length;$('rows').replaceChildren();const sorted=[...records].sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));$('empty').style.display=sorted.length?'none':'block';for(const r of sorted){const tr=document.createElement('tr');for(const [v,cls] of [[r.date,''],[money(r.amount),'right amount']]){const td=document.createElement('td');td.textContent=v;td.className=cls;tr.append(td)}const td=document.createElement('td');td.className='right';const edit=document.createElement('button');edit.className='plain';edit.textContent='编辑';edit.onclick=()=>{editing=r.id;$('date').value=r.date;$('amount').value=r.amount;$('formTitle').textContent='编辑记录';$('submit').textContent='保存修改';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='plain danger';del.textContent='删除';del.onclick=async()=>{if(confirm('确定删除这条记录吗？')){records=records.filter(x=>x.id!==r.id);try{await save();render()}catch(e){alert('保存失败，请检查服务是否运行')}}};td.append(edit,del);tr.append(td);$('rows').append(tr)}}
 function reset(){editing=null;$('form').reset();$('formTitle').textContent='添加一笔记录';$('submit').textContent='保存记录'}
 $('form').onsubmit=async e=>{e.preventDefault();const date=$('date').value,amount=Number($('amount').value);if(!date||!Number.isFinite(amount)||amount<=0)return;const old=records.slice();if(editing){const r=records.find(x=>x.id===editing);if(r){r.date=date;r.amount=Math.round(amount*100)/100}}else records.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date,amount:Math.round(amount*100)/100,createdAt:Date.now()});try{await save();reset();render()}catch(err){records=old;alert('写入 data.js 失败，请检查本地服务是否运行');}};
 $('clear').onclick=async()=>{if(records.length&&confirm('确定清空全部记录吗？建议先导出 CSV 备份。')){const old=records;records=[];try{await save();reset();render()}catch(e){records=old;alert('保存失败')}}};
 $('export').onclick=()=>{if(!records.length)return alert('暂无记录');const data=[['加油日期','金额'],...records.map(r=>[r.date,Number(r.amount).toFixed(2)])];const csv='\uFEFF'+data.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='加油记录.csv';a.click();URL.revokeObjectURL(a.href)};
 load();
})();
</script></body></html>
